name: pipeline

on: [push]

jobs:
  badges:
    if: github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: psyb0t/reusable-github-workflows/.github/workflows/create-badges.yml@master

  call-docker-image-workflow:
    permissions:
      contents: write # GitHub Release
      security-events: write # upload the Grype SARIF to the Security tab
    uses: psyb0t/reusable-github-workflows/.github/workflows/docker-image-workflow.yml@master

    with:
      repository_name: psyb0t/claudebox
      target_platforms: "linux/amd64,linux/arm64"
      # Report scan findings to the Security tab but don't fail the run, so the
      # clawhub publish job below can depend on this workflow succeeding.
      scan_fail_build: false
      # v2 split the image into two Dockerfiles: `Dockerfile` (minimal, ships as
      # :latest) and `Dockerfile.full` (toolchain-loaded, ships as :latest-full).
      # Pre-v2 the workflow used `target: full/minimal` on a multi-stage single
      # Dockerfile — no longer valid.
      # Both variants inherit immutable Aicodebox release manifests, so they
      # can build in parallel without a child-image latest-tag dependency.
      build_targets: '[{"file":"Dockerfile","tag_suffix":""},{"file":"Dockerfile.full","tag_suffix":"-full"}]'

    secrets:
      dockerhub_username: ${{ secrets.DOCKERHUB_USERNAME }}
      dockerhub_token: ${{ secrets.DOCKERHUB_TOKEN }}

  # Publish the skill (.agents/skills/) + plugin (.agents/plugins/) to ClawHub.
  # Tag pushes ONLY, and only after the Docker image build/push + GitHub release
  # have succeeded (needs the docker-image workflow, which does both).
  publish-to-clawhub:
    needs: [call-docker-image-workflow]
    if: startsWith(github.ref, 'refs/tags/')
    uses: psyb0t/reusable-github-workflows/.github/workflows/clawhub-publish.yml@master

    secrets:
      clawhub_token: ${{ secrets.CLAWHUB_TOKEN }}

  publish-to-mcp-registry:
    needs: [call-docker-image-workflow]
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      id-token: write
      contents: read
    uses: psyb0t/reusable-github-workflows/.github/workflows/mcp-registry-publish.yml@master

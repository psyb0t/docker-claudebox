[project]
name = "claudebox"
version = "2.0.0"
description = "Claude Code adapter for the aicodebox base image"
requires-python = ">=3.12"
authors = [{ name = "psyb0t" }]
license = { text = "WTFPL" }
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["claudebox"]

[tool.ruff]
line-length = 100
target-version = "py312"
